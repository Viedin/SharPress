<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="window"><rect x="620" y="40" width="520" height="280" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#f6f6f7"/>

  <!-- Logo, name and tagline -->
  <g transform="translate(64 72) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="#3451b2"/>
    <path d="M42 22c-2-4-6-6-11-6-6 0-10 3-10 8 0 12 22 6 22 18 0 5-5 8-11 8-6 0-10-3-12-7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="64" y="210" font-size="56" font-weight="700" fill="#213547">SharPress</text>
  <text x="64" y="250" font-size="22" fill="#3c3c43">Markdown docs inside your ASP.NET Core app.</text>
  <rect x="64" y="278" width="336" height="42" rx="8" fill="#ffffff" stroke="#e2e2e3"/>
  <text x="82" y="305" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3c3c43"><tspan fill="#3451b2">$</tspan> dotnet add package SharPress</text>

  <!-- A docs page in a browser window -->
  <g clip-path="url(#window)">
    <rect x="620" y="40" width="520" height="280" fill="#ffffff"/>
    <rect x="620" y="40" width="520" height="30" fill="#f6f6f7"/>
    <circle cx="638" cy="55" r="5" fill="#ff5f57"/>
    <circle cx="654" cy="55" r="5" fill="#febc2e"/>
    <circle cx="670" cy="55" r="5" fill="#28c840"/>
    <rect x="700" y="46" width="260" height="18" rx="9" fill="#ffffff" stroke="#e2e2e3"/>
    <text x="714" y="59" font-size="10" fill="#8e8e93">localhost/docs/getting-started</text>
    <rect x="620" y="70" width="520" height="1" fill="#e2e2e3"/>

    <!-- Top bar -->
    <rect x="636" y="80" width="16" height="16" rx="4" fill="#3451b2"/>
    <text x="660" y="93" font-size="13" font-weight="600" fill="#213547">My Site</text>
    <rect x="620" y="104" width="520" height="1" fill="#e2e2e3"/>

    <!-- Sidebar -->
    <rect x="620" y="105" width="140" height="215" fill="#f6f6f7"/>
    <text x="636" y="128" font-size="9" font-weight="600" letter-spacing="0.6" fill="#8e8e93">DOCUMENTATION</text>
    <text x="636" y="150" font-size="12" font-weight="600" fill="#3451b2">Getting started</text>
    <text x="636" y="172" font-size="12" fill="#3c3c43">Writing content</text>
    <text x="636" y="194" font-size="12" fill="#3c3c43">Configuration</text>
    <text x="636" y="216" font-size="12" fill="#3c3c43">Deploying</text>
    <rect x="760" y="105" width="1" height="215" fill="#e2e2e3"/>

    <!-- Content -->
    <text x="780" y="140" font-size="22" font-weight="700" fill="#213547">Getting started</text>
    <rect x="780" y="154" width="200" height="6" rx="3" fill="#e2e2e3"/>
    <rect x="780" y="168" width="176" height="6" rx="3" fill="#e2e2e3"/>
    <rect x="780" y="182" width="190" height="6" rx="3" fill="#e2e2e3"/>
    <rect x="780" y="200" width="210" height="54" rx="6" fill="#f6f6f7"/>
    <text x="792" y="222" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3c3c43">builder.<tspan fill="#3451b2">AddSharPress</tspan>();</text>
    <text x="792" y="240" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3c3c43">app.<tspan fill="#3451b2">UseSharPress</tspan>();</text>
    <rect x="780" y="268" width="200" height="6" rx="3" fill="#e2e2e3"/>
    <rect x="780" y="282" width="150" height="6" rx="3" fill="#e2e2e3"/>
    <rect x="780" y="296" width="172" height="6" rx="3" fill="#e2e2e3"/>

    <!-- On this page -->
    <text x="1016" y="128" font-size="10" font-weight="600" fill="#213547">On this page</text>
    <rect x="1008" y="138" width="1" height="54" fill="#e2e2e3"/>
    <rect x="1007" y="138" width="3" height="16" rx="1.5" fill="#3451b2"/>
    <text x="1016" y="150" font-size="10" fill="#3451b2">Install</text>
    <text x="1016" y="168" font-size="10" fill="#3c3c43">Configure</text>
    <text x="1016" y="186" font-size="10" fill="#3c3c43">Next steps</text>
  </g>
  <rect x="620.5" y="40.5" width="519" height="279" rx="10" fill="none" stroke="#e2e2e3"/>
</svg>
