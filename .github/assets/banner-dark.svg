    <path d="M28 21L23.5 51M40 21L35.5 51M17 30.5H46M15 41.5H44" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  </g>
  <text x="64" y="210" font-size="56" font-weight="700" fill="#ffffff">SharPress</text>
  <text x="64" y="250" font-size="22" fill="#dfdfd6">Markdown docs inside your ASP.NET Core app.</text>
  <rect x="64" y="278" width="336" height="42" rx="8" fill="#202127" stroke="#2e2e32"/>
  <text x="82" y="305" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#dfdfd6"><tspan fill="#a8b1ff">$</tspan> dotnet add package SharPress</text>

  <!-- A docs page in a browser window -->
