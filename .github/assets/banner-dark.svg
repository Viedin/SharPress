<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="window"><rect x="620" y="40" width="520" height="280" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#161618"/>

  <!-- Logo, name and tagline -->
  <g transform="translate(64 72) scale(1.25)">
