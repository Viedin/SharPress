      <path d="M14 4H44L60 20V50A10 10 0 0 1 50 60H14A10 10 0 0 1 4 50V14A10 10 0 0 1 14 4Z" fill="#3451b2"/>
      <path d="M44 4V14A6 6 0 0 0 50 20H60Z" fill="#a8b1ff"/>
      <path d="M28 21L23.5 51M40 21L35.5 51M17 30.5H46M15 41.5H44" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
    </g>
    <text x="660" y="93" font-size="13" font-weight="600" fill="#ffffff">My Site</text>
    <rect x="620" y="104" width="520" height="1" fill="#2e2e32"/>

