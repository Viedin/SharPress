    <text x="636" y="128" font-size="9" font-weight="600" letter-spacing="0.6" fill="#98989f">DOCUMENTATION</text>
    <text x="636" y="150" font-size="12" font-weight="600" fill="#a8b1ff">Getting started</text>
    <text x="636" y="172" font-size="12" fill="#dfdfd6">Writing content</text>
    <text x="636" y="194" font-size="12" fill="#dfdfd6">Configuration</text>
    <text x="636" y="216" font-size="12" fill="#dfdfd6">Deploying</text>
    <rect x="760" y="105" width="1" height="215" fill="#2e2e32"/>

    <!-- Content -->
    <text x="780" y="140" font-size="22" font-weight="700" fill="#ffffff">Getting started</text>
    <rect x="780" y="154" width="200" height="6" rx="3" fill="#2e2e32"/>
    <rect x="780" y="168" width="176" height="6" rx="3" fill="#2e2e32"/>
