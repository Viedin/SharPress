    <rect x="780" y="200" width="210" height="54" rx="6" fill="#161618"/>
    <text x="792" y="222" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#dfdfd6">builder.<tspan fill="#a8b1ff">AddSharPress</tspan>();</text>
    <text x="792" y="240" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#dfdfd6">app.<tspan fill="#a8b1ff">UseSharPress</tspan>();</text>
    <rect x="780" y="268" width="200" height="6" rx="3" fill="#2e2e32"/>
