name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build SharPress.slnx -c Release

      - name: Test
        run: dotnet test SharPress.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack SharPress/SharPress.csproj -c Release --no-build -o ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./artifacts/*
