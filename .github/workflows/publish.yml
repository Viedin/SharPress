name: Publish

# Pushing a version tag publishes that version: `git tag v0.1.0 && git push origin v0.1.0`.
# A tag with a suffix, such as v0.2.0-preview.1, publishes a prerelease.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release  # Holds the NUGET_USER secret; add required reviewers here for an approval gate.
    permissions:
      id-token: write     # Required for NuGet trusted publishing (OIDC). No API key is stored.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag is the version: it overrides SharPressVersion in Directory.Build.props.
      - name: Build
        run: dotnet build SharPress.slnx -c Release -p:SharPressVersion=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test SharPress.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack SharPress.Lib/SharPress.Lib.csproj -c Release --no-build -o ./artifacts -p:SharPressVersion=${{ steps.version.outputs.VERSION }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, not email

      # Pushes the .snupkg symbols package next to it as well.
      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./artifacts/*

  # A separate job, so a problem creating the release can never block the NuGet publish.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ./artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" ./artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
